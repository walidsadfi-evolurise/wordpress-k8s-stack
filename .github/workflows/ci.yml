name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint && yamllint -c .yamllint.yaml base overlays .github
      - run: shellcheck hack/*.sh images/backup/backup.sh
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate overlays (strict)
        run: |
          for o in dev prod; do
            kubectl kustomize overlays/$o > /tmp/$o.yaml
            kubeconform -strict -summary -skip ExternalSecret /tmp/$o.yaml
          done
      - name: Policy checks (no :latest in prod, resources everywhere, non-root)
        run: |
          ! grep -E 'image: .*:latest' /tmp/prod.yaml || { echo "prod must pin image tags"; exit 1; }
          python3 - <<'PY'
          import yaml, sys
          bad = []
          for doc in yaml.safe_load_all(open('/tmp/prod.yaml')):
              if not doc or doc['kind'] not in ('Deployment','StatefulSet','CronJob'): continue
              tpl = doc['spec']['template'] if doc['kind'] != 'CronJob' else doc['spec']['jobTemplate']['spec']['template']
              for c in tpl['spec'].get('initContainers', []) + tpl['spec']['containers']:
                  if 'requests' not in c.get('resources', {}) or 'limits' not in c.get('resources', {}): bad.append(f"{doc['kind']}/{doc['metadata']['name']}:{c['name']} resources")
                  sc = c.get('securityContext', {})
                  if sc.get('allowPrivilegeEscalation') is not False or sc.get('capabilities', {}).get('drop') != ['ALL']: bad.append(f"{doc['kind']}/{doc['metadata']['name']}:{c['name']} securityContext")
              if tpl['spec'].get('securityContext', {}).get('runAsNonRoot') is not True: bad.append(f"{doc['kind']}/{doc['metadata']['name']} runAsNonRoot")
          print('\n'.join(bad) or 'policy checks passed'); sys.exit(1 if bad else 0)
          PY

  kind-e2e:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: wp
          config: hack/kind-config.yaml
      - name: ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=180s
      - name: Build and load the PHP image
        run: |
          docker build -t ghcr.io/walidsadfi-evolurise/wordpress-k8s-php:dev images/php
          kind load docker-image --name wp ghcr.io/walidsadfi-evolurise/wordpress-k8s-php:dev
      - name: Deploy dev overlay
        run: |
          kubectl apply -k overlays/dev
          kubectl -n wordpress rollout status statefulset/mariadb --timeout=300s
          kubectl -n wordpress rollout status deployment/redis --timeout=120s
          kubectl -n wordpress rollout status deployment/wordpress --timeout=300s || { kubectl -n wordpress describe pod -l app.kubernetes.io/name=wordpress; kubectl -n wordpress logs -l app.kubernetes.io/name=wordpress --all-containers --tail=100; exit 1; }
      - name: Install WordPress and enable the object cache
        run: |
          hack/wp.sh core install --url=http://wordpress.localtest.me --title="CI shop" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          hack/wp.sh plugin activate redis-cache
          hack/wp.sh redis enable
          hack/wp.sh redis status
      - name: Smoke tests
        run: |
          echo "127.0.0.1 wordpress.localtest.me" | sudo tee -a /etc/hosts
          hack/smoke.sh
      - name: Pod Security (restricted) produced no warnings
        run: kubectl -n wordpress get events --field-selector reason=FailedCreate -o name | grep -q . && exit 1 || echo ok
      - if: failure()
        run: kubectl -n wordpress get all; kubectl -n wordpress describe pods | tail -200

  images:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/php
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/wordpress-k8s-php:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: images/backup
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/wordpress-k8s-backup:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
