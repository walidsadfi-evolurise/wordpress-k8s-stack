apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: php
          image: ghcr.io/walidsadfi-evolurise/wordpress-k8s-php:dev
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
        - name: nginx
          resources:
            requests:
              cpu: 10m
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wordpress
  namespace: wordpress
spec:
  minReplicas: 1
  maxReplicas: 2
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wordpress
  namespace: wordpress
spec:
  minAvailable: 0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-uploads
  namespace: wordpress
spec:
  accessModes: [ReadWriteOnce]   # kind's local-path provisioner has no RWX
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: wordpress
spec:
  template:
    spec:
      containers:
        - name: mariadb
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
  namespace: wordpress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: null
spec:
  tls: null
  rules:
    - host: wordpress.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  name: http
