# Secrets come from your vault through External Secrets Operator (https://external-secrets.io).
# Swap for SealedSecrets or SOPS if that is what your cluster already uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wordpress-db
  namespace: wordpress
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: wordpress-db }
  dataFrom:
    - extract: { key: wordpress/prod/db }   # WORDPRESS_DB_HOST, _NAME, _USER, _PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-root
  namespace: wordpress
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: mariadb-root }
  dataFrom:
    - extract: { key: wordpress/prod/mariadb-root }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wordpress-salts
  namespace: wordpress
spec:
  refreshInterval: 24h
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: wordpress-salts }
  dataFrom:
    - extract: { key: wordpress/prod/salts }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-s3
  namespace: wordpress
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: backup-s3 }
  dataFrom:
    - extract: { key: wordpress/prod/backup-s3 }
