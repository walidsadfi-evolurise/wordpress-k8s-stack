# Single-node MariaDB for teams without a managed database. For production at
# scale, point `wordpress-db` at a managed instance (RDS, OVH, Scaleway…) and
# drop this StatefulSet from the overlay — see overlays/prod/kustomization.yaml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: wordpress
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 90
      volumes:
        - name: config
          configMap:
            name: mariadb-config
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: root-secret
          secret:
            secretName: mariadb-root
      containers:
        - name: mariadb
          image: mariadb:11.4
          env:
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: MARIADB_ROOT_PASSWORD_FILE
              value: /run/secrets/db/MARIADB_ROOT_PASSWORD
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: WORDPRESS_DB_NAME
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: WORDPRESS_DB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: WORDPRESS_DB_PASSWORD
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d/wordpress.cnf
              subPath: wordpress.cnf
              readOnly: true
            - name: root-secret
              mountPath: /run/secrets/db
              readOnly: true
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
