apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: wordpress
data:
  # http-level directives (conf.d is included inside http {} by the image's nginx.conf)
  cache.conf: |
    upstream php { server 127.0.0.1:9000; keepalive 8; }

    fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=WORDPRESS:64m inactive=60m max_size=400m use_temp_path=off;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout updating http_500 http_503;
    fastcgi_cache_background_update on;
    fastcgi_cache_lock on;

    limit_req_zone $binary_remote_addr zone=pages:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    # Trust X-Forwarded-For from the ingress controller (cluster CIDRs; tighten to your controller's range).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;

  default.conf: |
    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html;
        index index.php;
        client_max_body_size 64m;
        server_tokens off;

        # -- per-request cache decision ---------------------------------------
        set $skip_cache 0;
        if ($request_method = POST) { set $skip_cache 1; }
        if ($query_string != "") { set $skip_cache 1; }
        if ($request_uri ~* "/wp-admin/|/wp-login\.php|/cart/|/checkout/|/my-account/|/addons/|sitemap(_index)?\.xml|/feed/") { set $skip_cache 1; }
        if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session") { set $skip_cache 1; }
        set $https_flag "";
        if ($http_x_forwarded_proto = "https") { set $https_flag "on"; }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location = /stub_status { access_log off; stub_status; allow 127.0.0.1; deny all; }

        location ~* \.(?:css|js|mjs|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm|pdf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location ~* /(?:wp-config\.php|wp-config-extra\.php|readme\.html|license\.txt|xmlrpc\.php|\.env|\.git) { return 404; }
        location ~* /(?:uploads|files)/.*\.php$ { return 404; }
        location ~ /\. { deny all; }

        location = /wp-login.php {
            limit_req zone=login burst=5 nodelay;
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include /etc/nginx/conf.d/fastcgi-pass.inc;
        }

        # REST API and AJAX are never cached: the Store API, MCP and agents need live data.
        # /wp-json is handed straight to index.php: a try_files fallback would re-enter
        # `location ~ \.php$` and pick up its cache. Needs pretty permalinks.
        location ^~ /wp-json/ {
            limit_req zone=pages burst=60 nodelay;
            include /etc/nginx/conf.d/fastcgi-pass.inc;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
        }
        location = /wp-admin/admin-ajax.php {
            limit_req zone=pages burst=60 nodelay;
            try_files $uri =404;
            include /etc/nginx/conf.d/fastcgi-pass.inc;
        }

        location / {
            limit_req zone=pages burst=60 nodelay;
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include /etc/nginx/conf.d/fastcgi-pass.inc;
            fastcgi_cache WORDPRESS;
            fastcgi_cache_valid 200 301 302 10m;
            fastcgi_cache_valid 404 1m;
            fastcgi_cache_bypass $skip_cache;
            fastcgi_no_cache $skip_cache;
            add_header X-Cache $upstream_cache_status always;
        }
    }

  # Shared FastCGI parameters (.inc so nginx does not load it as a top-level conf.d file)
  fastcgi-pass.inc: |
    fastcgi_pass php;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTPS $https_flag;
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    fastcgi_buffers 16 32k;
    fastcgi_buffer_size 64k;
    fastcgi_read_timeout 120s;
    fastcgi_keep_conn on;
