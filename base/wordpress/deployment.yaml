apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
    spec:
      serviceAccountName: wordpress
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 82      # www-data in the alpine images
        runAsGroup: 82
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: wordpress
      terminationGracePeriodSeconds: 60
      volumes:
        - name: code
          emptyDir:
            sizeLimit: 1Gi
        - name: uploads
          persistentVolumeClaim:
            claimName: wp-uploads
        - name: php-config
          configMap:
            name: php-config
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: fastcgi-cache
          emptyDir:
            sizeLimit: 512Mi
        - name: nginx-run
          emptyDir: {}
        - name: php-run
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      initContainers:
        # Copy the WordPress code out of the PHP image so nginx can serve static
        # files from the same tree. Code is immutable per release; uploads are not.
        - name: copy-code
          image: ghcr.io/walidsadfi-evolurise/wordpress-k8s-php:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /var/www/html/. /code/"]
          volumeMounts:
            - name: code
              mountPath: /code
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        # --- PHP-FPM: the application -----------------------------------------
        - name: php
          image: ghcr.io/walidsadfi-evolurise/wordpress-k8s-php:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: fastcgi
              containerPort: 9000
          envFrom:
            - secretRef:
                name: wordpress-db
            - secretRef:
                name: wordpress-salts
            - configMapRef:
                name: wordpress-env
          volumeMounts:
            - name: code
              mountPath: /var/www/html
            - name: uploads
              mountPath: /var/www/html/wp-content/uploads
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/zz-wordpress.ini
              subPath: zz-wordpress.ini
              readOnly: true
            - name: php-config
              mountPath: /usr/local/etc/php-fpm.d/zz-www.conf
              subPath: zz-www.conf
              readOnly: true
            - name: php-config
              mountPath: /var/www/html/wp-config-extra.php
              subPath: wp-config-extra.php
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: php-run
              mountPath: /var/run/php
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["php-fpm-healthcheck"]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["php-fpm-healthcheck"]
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["php-fpm-healthcheck", "--listen-queue=10"]
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
        # --- nginx: static files, FastCGI cache, security headers -------------
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /var/www/html
              readOnly: true
            - name: uploads
              mountPath: /var/www/html/wp-content/uploads
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/cache.conf
              subPath: cache.conf
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/fastcgi-pass.inc
              subPath: fastcgi-pass.inc
              readOnly: true
            - name: fastcgi-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5 && nginx -s quit"]
        # --- nginx exporter for Prometheus ------------------------------------
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.4
          imagePullPolicy: IfNotPresent
          args: ["--nginx.scrape-uri=http://127.0.0.1:8080/stub_status"]
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
