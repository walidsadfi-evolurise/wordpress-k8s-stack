apiVersion: v1
kind: ConfigMap
metadata:
  name: php-config
  namespace: wordpress
data:
  zz-wordpress.ini: |
    memory_limit = 256M
    upload_max_filesize = 64M
    post_max_size = 64M
    max_execution_time = 120
    max_input_vars = 5000
    expose_php = Off
    display_errors = Off
    log_errors = On
    error_log = /proc/self/fd/2
    opcache.enable = 1
    opcache.memory_consumption = 192
    opcache.interned_strings_buffer = 16
    opcache.max_accelerated_files = 20000
    opcache.validate_timestamps = 0
    opcache.jit = tracing
    opcache.jit_buffer_size = 64M
    realpath_cache_size = 4096K
    realpath_cache_ttl = 600
    session.save_handler = redis
    session.save_path = "tcp://redis:6379"
  zz-www.conf: |
    [www]
    pm = dynamic
    pm.max_children = 20
    pm.start_servers = 4
    pm.min_spare_servers = 2
    pm.max_spare_servers = 6
    pm.max_requests = 1000
    pm.status_path = /status
    ping.path = /ping
    request_terminate_timeout = 120s
    catch_workers_output = yes
    decorate_workers_output = no
    clear_env = no
  wp-config-extra.php: |
    <?php
    // Loaded by the image's wp-config.php. Secrets come from the environment.
    define('WP_REDIS_HOST', 'redis');
    define('WP_REDIS_PORT', 6379);
    define('WP_REDIS_PREFIX', getenv('WP_REDIS_PREFIX') ?: 'wp');
    define('WP_CACHE', true);
    define('DISABLE_WP_CRON', true);               // real cron runs in the CronJob
    define('WP_ENVIRONMENT_TYPE', getenv('WP_ENVIRONMENT_TYPE') ?: 'production');
    define('DISALLOW_FILE_EDIT', true);
    define('DISALLOW_FILE_MODS', getenv('WP_DISALLOW_FILE_MODS') === 'false' ? false : true); // deploy code, don't click it
    define('AUTOMATIC_UPDATER_DISABLED', true);
    define('FORCE_SSL_ADMIN', true);
    define('WP_MEMORY_LIMIT', '256M');
    if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
        $_SERVER['HTTPS'] = 'on';
    }
